description: 'Preprocessed widefield calcium imaging trial clips from two mice, identified
  as mouse1 (male) and mouse2 (female), viewing 78 natural images. Each clip contains
  the first 28 frames: 20 prestimulus frames and eight response frames, at 96 by 96
  spatial resolution. The frame interval is 0.024 seconds (approximately 41.67 Hz).
  The existing training, validation, and test partitions are preserved, with 64, eight,
  and eight trials per image per mouse, respectively. The release contains 12,480
  trials and accompanies the BrainStateDiff modeling code. The supplied recording
  date is April 24, 2025, and both mice were three months old. Original trial-to-session
  assignments and recording time of day are unspecified. NWB stores trial movies in
  a processing table with within-trial relative frame times, preserving the source
  values and split assignments without inventing intertrial chronology.'
